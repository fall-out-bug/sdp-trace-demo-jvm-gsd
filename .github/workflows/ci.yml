name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate gsd/features.json
        run: jq '.' gsd/features.json

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0

      - name: Run Bazel tests
        run: bazel test //...

      - name: Run bootstrap check
        run: bash scripts/bootstrap_check.sh

      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: sdp-trace-provenance
          path: provenance/**

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdp-trace-evidence
          path: evidence/**

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: sdp-trace-trace
          path: trace/**