name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v1
      
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.bazel/cache
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/BUILD.bazel', '**/WORKSPACE.bazel', '**/WORKSPACE') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-
      
      - name: Build
        run: bazel build //...
      
      - name: Test
        run: bazel test //...