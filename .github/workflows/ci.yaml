name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bazel
        run: |
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64 -O /usr/local/bin/bazel
          chmod +x /usr/local/bin/bazel
        shell: bash

      - name: Set Bazel version
        run: echo "USE_BAZEL_VERSION=8.7.0" >> $GITHUB_ENV
      
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.bazel/cache
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/BUILD.bazel', '**/WORKSPACE.bazel', '**/WORKSPACE') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-
      
      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: bazel-testlogs/
          retention-days: 7