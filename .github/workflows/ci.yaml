name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bazel
        run: |
          mkdir -p "$HOME/.bazel-bin"
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64 -O "$HOME/.bazel-bin/bazel"
          chmod +x "$HOME/.bazel-bin/bazel"
          echo "PATH=$HOME/.bazel-bin:$PATH" >> $GITHUB_ENV
        shell: bash

      - name: Set Bazel version
        run: echo "USE_BAZEL_VERSION=8.7.0" >> $GITHUB_ENV
      
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.bazel/cache
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/BUILD.bazel', '**/WORKSPACE.bazel', '**/WORKSPACE') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-
      
      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors

      - name: Upload Change Evidence Packets
        uses: actions/upload-artifact@v4
        with:
          name: change-evidence-packets
          path: .sdp-trace/packets/
          if-no-files-found: ignore
          retention-days: 180

      - name: Upload Evidence Bundles
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundles
          path: .sdp-trace/bundles/
          if-no-files-found: ignore
          retention-days: 180

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: bazel-testlogs/
          retention-days: 180
